# Standalone configuration: docker compose --env-file .env.prod -f compose.prod.yaml up --build -d
name: solana-compliance-lab-prod
services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: runtime
      args:
        VITE_CONSTELLATION_MODELS: ${VITE_CONSTELLATION_MODELS:-0.2.0-research,0.2.0-single-leader}
    ports:
    - ${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
    - backend-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
  collector:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: runtime
    command:
    - python
    - -m
    - collector
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      # 런타임 이미지는 pip 비편집 설치이므로 REPO_ROOT 기준 경로를 쓸 수 없습니다. 이미지 안의 절대 경로를 지정합니다.
      COLLECTOR_FIXTURE_ROOTS: /app/services/collector/fixtures:/app/contracts/fixtures
      COLLECTOR_LABEL_DATASET: /app/services/collector/data/labels/ofac-sdn.json
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      SOLANA_RPC_API_KEY: ${SOLANA_RPC_API_KEY:-}
      SOLANA_RPC_PROVIDER: ${SOLANA_RPC_PROVIDER:-}
      SOLANA_RPC_API_KEY_HEADER: ${SOLANA_RPC_API_KEY_HEADER:-X-API-KEY}
      SOLANA_RPC_TIMEOUT: ${SOLANA_RPC_TIMEOUT:-15}
      SOLANA_RPC_MAX_TX_VERSION: ${SOLANA_RPC_MAX_TX_VERSION:-1}
      COLLECTOR_MAX_TRANSACTIONS: ${COLLECTOR_MAX_TRANSACTIONS:-1000}
      COLLECTOR_FETCH_WORKERS: ${COLLECTOR_FETCH_WORKERS:-16}
      # Keep below the Backend's 30s upstream read timeout.
      COLLECTOR_TIME_BUDGET_SECONDS: ${COLLECTOR_TIME_BUDGET_SECONDS:-20}
      COLLECTOR_MAX_TOKEN_ACCOUNTS: ${COLLECTOR_MAX_TOKEN_ACCOUNTS:-100}
      COLLECTOR_MAX_DISCOVERY_TRANSACTIONS: ${COLLECTOR_MAX_DISCOVERY_TRANSACTIONS:-1000}
      COLLECTOR_DERIVE_ATA: ${COLLECTOR_DERIVE_ATA:-true}
      COLLECTOR_ATA_MINTS: ${COLLECTOR_ATA_MINTS:-}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
  kyt-engine:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: runtime
    command:
    - python
    - -m
    - kyt_engine
    - --host
    - 0.0.0.0
    - --port
    - '8001'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
  policy-engine:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: runtime
    command:
    - python
    - -m
    - policy_engine
    - --host
    - 0.0.0.0
    - --port
    - '8002'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
  gateway:
    build:
      context: .
      dockerfile: docker/java.Dockerfile
      target: runtime
      args:
        MODULE: simulations/gateway
    environment:
      GATEWAY_HOST: 0.0.0.0
      SERVER_PORT: '8003'
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://127.0.0.1:$${SERVER_PORT}/health" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
  constellation:
    build:
      context: .
      dockerfile: docker/java.Dockerfile
      target: runtime
      args:
        MODULE: simulations/constellation
    environment:
      CONSTELLATION_HOST: 0.0.0.0
      SERVER_PORT: '8004'
      CONSTELLATION_MOCK_ENABLED: 'false'
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://127.0.0.1:$${SERVER_PORT}/health" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
  backend:
    build:
      context: .
      dockerfile: docker/java.Dockerfile
      target: runtime
      args:
        MODULE: apps/backend
    environment:
      CASES_DIR: /app/data/cases
      EXPERIMENTS_DIR: /app/data/experiments
      BACKEND_HOST: 0.0.0.0
      SERVER_PORT: '8080'
      KYT_URL: http://kyt-engine:8001
      POLICY_URL: http://policy-engine:8002
      GATEWAY_URL: http://gateway:8003
      CONSTELLATION_URL: http://constellation:8004
      LOCAL_COLLECTOR_FIXTURES_DIR: /app/contracts/fixtures
      DEFAULT_RULESET_VERSION: ${DEFAULT_RULESET_VERSION:-1.0.0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      COLLECTOR_URL: ${COLLECTOR_URL:-http://collector:8000}
      LOCAL_COLLECTOR_ENABLED: 'false'
    depends_on:
      collector:
        condition: service_healthy
      kyt-engine:
        condition: service_healthy
      policy-engine:
        condition: service_healthy
      gateway:
        condition: service_healthy
      constellation:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://127.0.0.1:$${SERVER_PORT}/health" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
    ports:
    - ${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080

volumes:
  backend-data: null
