# Standalone configuration: docker compose -f compose.dev.yaml up --build -d
name: solana-compliance-lab-dev
services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: development
    environment:
      VITE_API_MODE: backend
      VITE_API_BASE_URL: ""
      VITE_BACKEND_URL: http://backend:8080
      VITE_DEMO_FIXTURES: 'off'
      VITE_CONSTELLATION_MODELS: ${VITE_CONSTELLATION_MODELS:-0.2.0-research,0.2.0-single-leader}
    ports:
    - 127.0.0.1:${FRONTEND_PORT:-5173}:5173
    volumes:
    - ./apps/frontend/src:/workspace/apps/frontend/src:ro
    - ./apps/frontend/public:/workspace/apps/frontend/public:ro
    - ./apps/frontend/demo:/workspace/apps/frontend/demo:ro
    - ./apps/frontend/index.html:/workspace/apps/frontend/index.html:ro
    - ./apps/frontend/vite.config.ts:/workspace/apps/frontend/vite.config.ts:ro
    - ./presentation:/workspace/presentation:ro
    - ./contracts:/workspace/contracts:ro
    - ./services/collector/fixtures:/workspace/services/collector/fixtures:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
  collector:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: development
    command:
    - python
    - -m
    - collector
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      SOLANA_RPC_API_KEY: ${SOLANA_RPC_API_KEY:-}
      SOLANA_RPC_PROVIDER: ${SOLANA_RPC_PROVIDER:-}
      SOLANA_RPC_API_KEY_HEADER: ${SOLANA_RPC_API_KEY_HEADER:-X-API-KEY}
      SOLANA_RPC_TIMEOUT: ${SOLANA_RPC_TIMEOUT:-15}
      SOLANA_RPC_MAX_TX_VERSION: ${SOLANA_RPC_MAX_TX_VERSION:-1}
      COLLECTOR_MAX_TRANSACTIONS: ${COLLECTOR_MAX_TRANSACTIONS:-1000}
      COLLECTOR_FETCH_WORKERS: ${COLLECTOR_FETCH_WORKERS:-16}
      # Keep below the Backend's 30s upstream read timeout.
      COLLECTOR_TIME_BUDGET_SECONDS: ${COLLECTOR_TIME_BUDGET_SECONDS:-20}
      COLLECTOR_MAX_TOKEN_ACCOUNTS: ${COLLECTOR_MAX_TOKEN_ACCOUNTS:-100}
      COLLECTOR_MAX_DISCOVERY_TRANSACTIONS: ${COLLECTOR_MAX_DISCOVERY_TRANSACTIONS:-1000}
      COLLECTOR_DERIVE_ATA: ${COLLECTOR_DERIVE_ATA:-true}
      COLLECTOR_ATA_MINTS: ${COLLECTOR_ATA_MINTS:-}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
    - 127.0.0.1:8000:8000
    volumes:
    - ./services:/app/services:ro
    - ./contracts:/app/contracts:ro
    - ./tests:/app/tests:ro
    - ./scripts:/app/scripts:ro
  kyt-engine:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: development
    command:
    - python
    - -m
    - kyt_engine
    - --host
    - 0.0.0.0
    - --port
    - '8001'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
    - 127.0.0.1:8001:8001
    volumes:
    - ./services:/app/services:ro
    - ./contracts:/app/contracts:ro
    - ./tests:/app/tests:ro
    - ./scripts:/app/scripts:ro
  policy-engine:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: development
    command:
    - python
    - -m
    - policy_engine
    - --host
    - 0.0.0.0
    - --port
    - '8002'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
    - 127.0.0.1:8002:8002
    volumes:
    - ./services:/app/services:ro
    - ./contracts:/app/contracts:ro
  gateway:
    build:
      context: .
      dockerfile: docker/java.Dockerfile
      target: development
      args:
        MODULE: simulations/gateway
    environment:
      GATEWAY_HOST: 0.0.0.0
      SERVER_PORT: '8003'
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://127.0.0.1:$${SERVER_PORT}/health" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    command:
    - mvn
    - -B
    - -ntp
    - -pl
    - simulations/gateway
    - spring-boot:run
    ports:
    - 127.0.0.1:8003:8003
    volumes:
    - ./simulations/gateway/src:/workspace/simulations/gateway/src:ro
    - maven-cache:/root/.m2
  constellation:
    build:
      context: .
      dockerfile: docker/java.Dockerfile
      target: development
      args:
        MODULE: simulations/constellation
    environment:
      CONSTELLATION_HOST: 0.0.0.0
      SERVER_PORT: '8004'
      CONSTELLATION_MOCK_ENABLED: 'true'
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://127.0.0.1:$${SERVER_PORT}/health" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    command:
    - mvn
    - -B
    - -ntp
    - -pl
    - simulations/constellation
    - spring-boot:run
    ports:
    - 127.0.0.1:8004:8004
    volumes:
    - ./simulations/constellation/src:/workspace/simulations/constellation/src:ro
    - maven-cache:/root/.m2
  backend:
    build:
      context: .
      dockerfile: docker/java.Dockerfile
      target: development
      args:
        MODULE: apps/backend
    environment:
      CASES_DIR: /workspace/data/cases
      EXPERIMENTS_DIR: /workspace/data/experiments
      BACKEND_HOST: 0.0.0.0
      SERVER_PORT: '8080'
      COLLECTOR_URL: http://collector:8000
      KYT_URL: http://kyt-engine:8001
      POLICY_URL: http://policy-engine:8002
      GATEWAY_URL: http://gateway:8003
      CONSTELLATION_URL: http://constellation:8004
      LOCAL_COLLECTOR_FIXTURES_DIR: /workspace/contracts/fixtures
      DEFAULT_RULESET_VERSION: ${DEFAULT_RULESET_VERSION:-1.0.0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      LOCAL_COLLECTOR_ENABLED: 'false'
    depends_on:
      collector:
        condition: service_healthy
      kyt-engine:
        condition: service_healthy
      policy-engine:
        condition: service_healthy
      gateway:
        condition: service_healthy
      constellation:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS "http://127.0.0.1:$${SERVER_PORT}/health" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    command:
    - mvn
    - -B
    - -ntp
    - -pl
    - apps/backend
    - spring-boot:run
    ports:
    - 127.0.0.1:${BACKEND_PORT:-8080}:8080
    volumes:
    - ./apps/backend/src:/workspace/apps/backend/src:ro
    - ./contracts/schemas:/workspace/contracts/schemas:ro
    - backend-data:/workspace/data
    - ./contracts/fixtures:/workspace/contracts/fixtures:ro
    - maven-cache:/root/.m2
volumes:
  maven-cache: null
  backend-data: null
