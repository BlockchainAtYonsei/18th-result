name: creator-revenue-bridge-dev

services:
  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      DEMO_CONTROL_ENABLED: "true"
      WEB3_RPC_URL: http://anvil:8545
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public:ro
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  backend:
    build:
      context: ./backend
      target: development
    command: sh ./gradlew bootRun --no-daemon
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DATABASE_NAME:-creator_revenue_bridge}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER:-crb}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-crb_dev}
      WEB3_RPC_URL: http://anvil:8545
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - backend_gradle:/root/.gradle
    depends_on:
      anvil:
        condition: service_healthy
      database:
        condition: service_healthy

  database:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-creator_revenue_bridge}
      POSTGRES_USER: ${DATABASE_USER:-crb}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-crb_dev}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-crb} -d ${DATABASE_NAME:-creator_revenue_bridge}"]
      interval: 2s
      timeout: 3s
      retries: 20

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.1
    entrypoint: ["anvil"]
    command:
      - --host
      - 0.0.0.0
      - --chain-id
      - "31337"
    ports:
      - "${ANVIL_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 2s
      retries: 15

  forge:
    image: ghcr.io/foundry-rs/foundry:v1.8.1
    user: "0:0"
    working_dir: /workspace/contracts
    entrypoint: ["forge"]
    command: ["test"]
    environment:
      RPC_URL: http://anvil:8545
      DEPLOYER_PRIVATE_KEY: ${ANVIL_DEPLOYER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      LOCAL_ISSUER_ADDRESS: ${LOCAL_ISSUER_ADDRESS:-0x70997970C51812dc3A010C7d01b50e0d17dc79C8}
      LOCAL_SETTLER_ADDRESS: ${LOCAL_SETTLER_ADDRESS:-0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC}
      LOCAL_CREATOR_ADDRESS: ${LOCAL_CREATOR_ADDRESS:-0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65}
      LOCAL_INVESTOR_ADDRESS: ${LOCAL_INVESTOR_ADDRESS:-0x90F79bf6EB2c4f870365E785982E1f101E93b906}
      LOCAL_INVESTOR_BALANCE: ${LOCAL_INVESTOR_BALANCE:-1000000000000}
      LOCAL_SETTLER_BALANCE: ${LOCAL_SETTLER_BALANCE:-1000000000000}
      LOCAL_TOKEN_BASE_URI: ${LOCAL_TOKEN_BASE_URI:-http://localhost:3000/api/revenue-rights/{id}.json}
    volumes:
      - ./contracts:/workspace/contracts
      - forge_broadcast:/workspace/contracts/broadcast
      - forge_cache:/workspace/contracts/cache
      - forge_out:/workspace/contracts/out
    depends_on:
      anvil:
        condition: service_healthy

volumes:
  frontend_node_modules:
  frontend_next:
  backend_gradle:
  database_data:
  forge_broadcast:
  forge_cache:
  forge_out:
